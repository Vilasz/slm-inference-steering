[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slm-inference-steering"
version = "0.1.0"
description = "Baseline experimental para inferencia de SLMs com HumanEval."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "accelerate==0.34.2",
  "datasets==2.21.0",
  "huggingface-hub==0.25.2",
  "matplotlib==3.9.2",
  "numpy==1.26.4",
  "pandas==2.2.3",
  "pyarrow==17.0.0",
  "safetensors==0.4.5",
  "tqdm==4.66.5",
  "transformers==4.46.3",
]

[tool.setuptools.packages.find]
where = ["src"]
