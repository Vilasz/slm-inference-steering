name: lint

on:
  push:
  pull_request:

jobs:
  ruff-mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Install lightweight dependencies
        run: uv pip install --system -e ".[dev,viz,research]"
      - name: Ruff
        run: python -m ruff check .
      - name: Mypy
        run: python -m mypy src scripts
