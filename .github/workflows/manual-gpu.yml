name: manual-gpu

on:
  workflow_dispatch:

jobs:
  dry-run-gpu-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Install CUDA-oriented requirements
        run: uv pip install --system -r requirements.txt
      - name: Environment diagnosis
        run: python scripts/diagnose_cuda.py || true
      - name: Plan steering sweep without model load
        run: python scripts/run_steering_sweep.py --limit 1 --n 1 --alphas 0 --layers 8 --dry-run
