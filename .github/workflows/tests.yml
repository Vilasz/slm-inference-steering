name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Install lightweight dependencies
        run: uv pip install --system -e ".[dev,viz,research]"
      - name: Run unit tests
        run: python -m pytest -m "not slow and not gpu and not integration"
      - name: Run smoke pipeline
        run: python scripts/run_experiment.py --config configs/smoke.yaml
